plugins {
    id "com.android.application"
}

android {
    namespace "app.sic.strength"
    compileSdk 34

    defaultConfig {
        applicationId "app.sic.strength"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "1.2.0"
    }

    signingConfigs {
        debug {
            // Persisted debug key (not a release key). SHA-256 8c342aa682f40761f543ebe855fed1291cbe7b4bc8a08a11acbc7005b229d4c2
            storeFile file("${rootProject.projectDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
}
