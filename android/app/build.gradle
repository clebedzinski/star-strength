plugins {
    id "com.android.application"
}

android {
    namespace "app.sic.strength"
    compileSdk 34

    defaultConfig {
        applicationId "app.sic.strength"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2-sic-debug"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // Debug signing is the Android Gradle default debug keystore.
            // It will not update an APK signed with a different key.
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
}
