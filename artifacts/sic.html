<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">
  <title>Strength in Character</title>
  <style>
:root {
  --bg: #0B0F17;
  --card: #1E293B;
  --border: #334155;
  --text: #F8FAFC;
  --accent: #F59E0B;
  --accent-2: #38BDF8;
  --on-accent: #111111;
  --muted: #cbd5e1;
  --surface: #111827;
  --field-bg: #0f172a;
  --field-text: #f8fafc;
  --field-border: #94a3b8;
  --font: "Inter", system-ui, sans-serif;
  --radius: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; max-width: 100%; }
body.sic {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body.sic, body.sic * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, .selectable, .console-log, pre { -webkit-user-select: text; user-select: text; }
button, a { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button, input, select, textarea { font-family: inherit; font-size: 16px; }
button {
  background: var(--field-bg);
  color: var(--field-text);
  border: 1px solid var(--field-border);
  border-radius: 10px;
  min-height: 44px;
  min-width: 44px;
  padding: 8px 12px;
  font-weight: 800;
}
input, textarea, select {
  background-color: var(--field-bg);
  color: var(--field-text);
  border: 1px solid var(--field-border);
  border-radius: 10px;
  min-height: 44px;
  padding: 8px 10px;
  width: 100%;
  max-width: 100%;
}
select {
  appearance: none;
  padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 10px) calc(50% - 2px);
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
input::placeholder { color: var(--muted); opacity: 0.85; }
#chrome-bar {
  flex: none;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 0;
  background: transparent;
  z-index: 5;
}
#chrome-bar:has(#save-state[hidden]) { display: none; }
#save-state {
  position: static;
  min-height: 28px;
  font-size: 12px;
  font-weight: 800;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
}
#save-state[data-kind="error"] { color: #fecaca; border-color: #f87171; }
#save-state[data-kind="dirty"] { color: var(--accent); }
#settings-anchor { display: none; }
#app {
  flex: 1;
  min-height: 0;
  min-width: 0;
  width: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  background: transparent;
  padding-bottom: calc(16px + var(--safe-bottom));
  background: var(--bg);
  position: relative;
  z-index: 1;
}
.prompt { display: none; }
body.sic.show-prompts .prompt {
  display: inline-flex;
  align-items: center;
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 6px;
  border: 1px solid currentColor;
  font-size: 10px;
}
.row, .spread, .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 100%; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stack > span, label.stack { font-size: 12px; font-weight: 800; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card, .board, .board-frame, .departure, .win, .dial-stage, .pixel-desk, .hive, .transit, .deck {
  max-width: 100%;
  min-width: 0;
}
.card {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
.muted { color: var(--muted); }
.hidden { display: none !important; }
h1, h2, h3 { line-height: 1.15; overflow-wrap: anywhere; }
.log-set, .primary {
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
  font-weight: 900;
}
.finish { background: transparent; color: var(--text); border: 1px solid var(--field-border); }
.ghost { background: var(--field-bg); color: var(--field-text); border: 1px solid var(--field-border); }
.done { width: 44px; height: 44px; min-width: 44px; flex: none; border-radius: 10px; padding: 0; }
.setline-top .ghost { flex: none; }
.done.on { background: #059669; color: #ecfdf5; border-color: #059669; }
.prev {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
#fx-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; display: none; opacity: 0.2;
}
.overlay, #mini-root, #toast-root, .pop { z-index: 30; }
.timer-readout, .metro-readout { font-variant-numeric: tabular-nums; font-weight: 900; }

/* Classic — spreadsheet lockup matching the original Star Strength page */
body.skin-starclassic #chrome-bar {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
}
body.skin-starclassic #app {
  overflow: hidden;
  padding-bottom: 0;
  display: flex;
  flex-direction: column;
}
.classic {
  flex: 1; min-height: 0; width: 100%; max-width: none; margin: 0;
  display: flex; flex-direction: column; background: var(--bg);
}
.ss-dock { flex: none; background: var(--card); border-bottom: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.28); }
.ss-head, .ss-tabs, .ss-routine, .ss-scroll { padding-left: max(8px, calc((100% - 56rem) / 2)); padding-right: max(8px, calc((100% - 56rem) / 2)); }
.ss-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 6px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.ss-brand { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.ss-star {
  width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-weight: 900; font-size: 13px; flex: none;
  box-shadow: 0 4px 10px rgba(0,0,0,.25);
}
.ss-titles { min-width: 0; }
.ss-brand h1 { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: 0; line-height: 1.05; white-space: normal; }
.ss-brand p {
  margin: 0; font-size: 8px; letter-spacing: 0.08em; color: var(--accent); font-weight: 800;
  white-space: normal;
}
.ss-tools { display: flex; align-items: center; gap: 2px; flex: none; }
.ss-tools button, .ss-card-side .icon-btn, .ss-table .icon-btn, .ss-done, .ss-add, .ss-end, .ss-log, .ss-tabs .tab, .whats-strip button, .ss-partners button {
  min-width: 0;
}
.ss-tools button {
  width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 8px;
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  display: grid; place-items: center;
}
.ss-tools button[aria-label="Bug report"] { color: #f87171; }
.ss-tools button[aria-label="Tempo"] { color: #60a5fa; }
.ss-zzz { color: var(--accent); font-size: 10px; font-weight: 900; letter-spacing: 0; }
.ico { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.ss-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--border); }
.ss-tabs .tab {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent;
  color: var(--text); opacity: 0.55; min-height: 40px; padding: 8px 2px; font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.ss-tabs .tab[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); opacity: 1; }
.ss-routine { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; padding-bottom: 8px; }
.ss-routine-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ss-routine h2 { margin: 0; font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-duo { font-size: 9px; font-weight: 900; color: #a5b4fc; background: rgba(99,102,241,.2); border: 1px solid rgba(99,102,241,.35); border-radius: 4px; padding: 1px 5px; flex: none; }
.ss-routine-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.ss-routine select { width: auto; max-width: 118px; min-height: 30px; font-size: 12px; font-weight: 800; color: var(--accent); padding: 2px 6px; border-radius: 6px; }
.ss-rest { font-size: 11px; color: var(--accent); }
.ss-end {
  min-height: 30px; padding: 4px 10px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 900;
  display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.ss-scroll { flex: 1; min-height: 0; overflow: auto; padding-top: 12px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 12px; }
.whats-strip {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--border); font-size: 12px; font-weight: 800;
}
.whats-strip span { flex: 1; min-width: 0; }
.whats-strip button { min-height: 32px; padding: 4px 8px; font-size: 12px; }
.ss-card { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.ss-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ss-ex { display: flex; align-items: center; gap: 8px; min-width: 0; }
.muscle-icon { stroke: var(--accent); fill: var(--accent); fill-opacity: 0.2; display: block; }
.ss-muscle { padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); flex: none; display: grid; }
.ss-muscle .muscle-icon { width: 28px; height: 28px; }
.ss-ex-copy { min-width: 0; }
.ss-ex h3 { margin: 0; font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ss-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; min-width: 0; }
.ss-chip, .ss-pr { font-size: 10px; font-weight: 800; border: 1px solid var(--border); background: var(--bg); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.ss-chip { color: var(--accent); }
.ss-pr { color: var(--accent-2); }
.ss-note {
  display: block; width: 100%; min-height: 0; height: 22px; border: 0; background: transparent;
  color: var(--muted); font-size: 11px; font-style: italic; font-weight: 600; padding: 2px 0 0;
}
.ss-card-side { display: flex; align-items: center; gap: 4px; flex: none; }
.ss-log { min-height: 28px; padding: 4px 8px; font-size: 11px; border-radius: 8px; }
.ss-card-side .icon-btn, .ss-table .icon-btn {
  width: 28px; height: 28px; min-height: 28px; padding: 0; border: 0; background: transparent; color: var(--muted); border-radius: 6px;
}
.ss-partners { display: flex; gap: 4px; margin-top: 8px; }
.ss-partners button { min-height: 28px; padding: 2px 8px; font-size: 12px; }
.ss-partners button[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ss-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
.ss-table th { font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: var(--muted); text-align: left; padding: 4px 2px; border-bottom: 1px solid var(--border); opacity: 0.85; }
.ss-table th:nth-child(5), .ss-table th:nth-child(6), .ss-table th:nth-child(7),
.ss-table td:nth-child(5), .ss-table td:nth-child(6), .ss-table td:nth-child(7) { text-align: center; }
.ss-table td { padding: 2px 1px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.ss-table .ss-n, .ss-table .ss-prev { font-size: 11px; color: var(--muted); font-weight: 700; text-align: center; }
.ss-table .ss-prev { font-family: ui-monospace, monospace; text-align: left; white-space: nowrap; }
.ss-table input, .ss-table select {
  min-height: 22px; height: 22px; font-size: 12px; font-weight: 800; padding: 0 2px; border-radius: 4px; width: auto; line-height: 1;
}
.ss-table input[data-field="weight"] { width: 2.8rem; text-align: center; color: var(--accent); }
.ss-table input[data-field="reps"] { width: 2.3rem; text-align: center; color: var(--text); }
.ss-table select { width: 4.15rem; font-size: 10px; font-weight: 700; padding-right: 0; }
.ss-table input::-webkit-outer-spin-button, .ss-table input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.ss-done {
  width: 24px; height: 24px; min-height: 24px; padding: 0; border-radius: 4px; margin: 0 auto;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border); display: grid; place-items: center;
}
.ss-done .ico { width: 12px; height: 12px; }
.ss-done.on { background: #10b981; color: #042f1d; border-color: #10b981; }
.ss-current td { background: rgba(245, 158, 11, 0.08); }
.ss-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.ss-add { min-height: 32px; padding: 4px 0; border: 0; background: transparent; color: var(--accent); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
.ss-count { font-size: 11px; font-weight: 700; opacity: 0.75; white-space: nowrap; }
.ss-append h3 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.ss-append h3 .ico { stroke: var(--accent); }
.ss-addrow { display: flex; gap: 8px; align-items: center; }
.ss-addrow input { min-height: 36px; font-size: 12px; font-weight: 800; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; }
.tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; color: var(--text); min-width: 44px; padding: 10px 8px; }
.ss-tabs .tab { min-width: 0; }
.tab[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.setline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.setline-top { grid-column: 1 / -1; display: grid; grid-template-columns: auto auto minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
.setline-top .prev { grid-column: 1 / -1; }
.setline-top select { width: auto; min-width: 112px; }
.setline label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 800; color: var(--muted); min-width: 0; }
.pad { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 640px) {
  .ss-star { width: 32px; height: 32px; font-size: 16px; }
  .ss-brand h1 { font-size: 20px; }
  .ss-brand p { font-size: 10px; }
  .ss-tools button { width: 36px; height: 36px; min-height: 36px; }
  .ss-tabs .tab { font-size: 14px; gap: 6px; }
  .ss-routine h2 { font-size: 14px; }
  .ss-ex h3 { font-size: 16px; }
}

/* Shared composed controls for the seven skins */
.nudge-pad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 100%; }
.nudge-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12px; font-weight: 800; }
.nudge-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 4px; }
.nudge-row button { min-width: 44px; width: 44px; min-height: 44px; padding: 0; font-size: 22px; }
.nudge-row input { min-width: 0; text-align: center; font-weight: 900; padding: 4px; }
.setdots, .ex-wrap, .tickets, .manage-row, .skin-bar, .add-row { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; }
.setdot { width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; }
.setdot.on { outline: 3px solid var(--accent); }
.setdot.done { background: #059669; color: #ecfdf5; border-color: #059669; }
.ex-chip, .ticket, .station { min-height: 44px; max-width: 100%; }
.add-row input { flex: 1; min-width: 0; }
.skin-bar > * { min-height: 44px; }
.skin-bar select { width: auto; flex: 1 1 140px; min-width: 0; max-width: 100%; }
.manage-row button, .skin-bar button, .ex-chip { min-height: 44px; }

/* Pixel */
.skin-pixelforecast { background: #07101f; color: #f8fafc; }
.pixel-desk { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.px-city { height: 36px; background:
  linear-gradient(#07101f, #07101f) 0 28px / 100% 8px no-repeat,
  linear-gradient(#3ee0ff, #3ee0ff) 8px 8px / 18px 22px no-repeat,
  linear-gradient(#ff4fa3, #ff4fa3) 32px 4px / 14px 26px no-repeat,
  linear-gradient(#ffe14a, #ffe14a) 52px 12px / 16px 18px no-repeat,
  linear-gradient(#3ee0ff, #3ee0ff) 74px 10px / 12px 20px no-repeat; }
.px-name { margin: 0 0 8px; font-size: 16px; }
.px-read { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.px-read b { font-size: 32px; line-height: 1; }
.px-read i { font-style: normal; font-size: 12px; font-weight: 800; }
.px-clock { align-self: center; font-weight: 900; color: #efe7c6; }
.win { background: #efe7c6; color: #1a120c; border: 3px solid #24160f; box-shadow: 4px 4px 0 #24160f; }
.win header { background: #ff4fa3; color: #1a120c; display: flex; justify-content: space-between; gap: 8px; padding: 8px; font-weight: 900; }
.win .body { padding: 8px; }
.win.rest header { background: #3ee0ff; }
.win.tempo header { background: #ffe14a; }
.win input, .win select, .win textarea, .win button, .win .ghost, .win .card {
  background: #fffaf0;
  color: #1a120c;
  border-color: #24160f;
}
.win .card { box-shadow: none; }
.win .log-set, .win .primary { background: #ff4fa3; color: #1a120c; border: 2px solid #24160f; }
.win .done.on { background: #15803d; color: #f0fdf4; }
.taskbar {
  display: flex; flex-wrap: wrap; gap: 6px;
  background: #24160f; color: #efe7c6; padding: 8px; border: 3px solid #efe7c6;
}
.taskbar button { background: #efe7c6; color: #1a120c; border: 2px solid #efe7c6; min-width: 44px; padding: 8px 10px; }
.taskbar button[aria-current="true"] { background: #ff4fa3; }
.taskbar .finish { background: #ffe14a; color: #1a120c; flex: 1 1 100%; }

/* Iron */
.skin-irondial { background: radial-gradient(circle at 50% 30%, #3a414b, #121418 70%); }
.dial-stage, .vinyl-page, .hive, .transit { width: 100%; max-width: 720px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; box-sizing: border-box; }
.iron-name, .score-name, .dest { margin: 0; text-align: center; overflow-wrap: anywhere; }
.iron-meta { text-align: center; }
.iron-panel { background: var(--card); color: var(--text); border-radius: 12px; padding: 12px; }
.corner-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.corner-nav select, .actions select { width: auto; min-width: 120px; max-width: 100%; }
.corner-nav button { background: #1c2128; color: #f4f1ea; border-color: #5c656f; }
.dial-wrap { width: min(100%, 300px); margin: 0 auto; }
.dial { width: 100%; aspect-ratio: 1; border-radius: 50%; position: relative; background: radial-gradient(circle at 50% 42%, #5b6570, #1c2128 72%); box-shadow: inset 0 0 0 10px #2a3038, 0 16px 30px rgba(0,0,0,.45); }
.dial .rim { position: absolute; inset: 0; }
.hub { position: absolute; inset: 27%; border-radius: 50%; background: #ff7a18; color: #1a1008; border: 0; box-shadow: 0 0 0 6px #1a1008; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.hub small { font-size: 12px; }
.orbit { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: 0; background: #2a3038; color: #f4f1ea; }
.orbit.n { top: 4%; left: 50%; transform: translateX(-50%); }
.orbit.s { bottom: 4%; left: 50%; transform: translateX(-50%); }
.orbit.w { left: 4%; top: 50%; transform: translateY(-50%); }
.orbit.e { right: 4%; top: 50%; transform: translateY(-50%); }
.dial-read { position: absolute; top: 18%; left: 12%; right: 12%; text-align: center; color: #f4f1ea; font-weight: 800; }
.dial-read strong { display: block; overflow-wrap: anywhere; }
.readout-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    document.querySelectorAll('[data-hist="name"]').forEach(function (el) { rec.exercises[Number(el.dataset.i)].exercise = el.value; });
    document.querySelectorAll('[data-hist="partner"]').forEach(function (el) { rec.exercises[Number(el.dataset.i)].partner = el.value === 'robin' ? 'robin' : 'batman'; });
    document.querySelectorAll('[data-hist="muscle"]').forEach(function (el) { rec.exercises[Number(el.dataset.i)].muscle = el.value; });
    document.querySelectorAll('[data-hist="type"]').forEach(function (el) { rec.exercises[Number(el.dataset.i)].sets[Number(el.dataset.j)].type = el.value; });
    document.querySelectorAll('[data-hist="weight"]').forEach(function (el) { rec.exercises[Number(el.dataset.i)].sets[Number(el.dataset.j)].weight = el.value; });
    document.querySelectorAll('[data-hist="reps"]').forEach(function (el) { rec.exercises[Number(el.dataset.i)].sets[Number(el.dataset.j)].reps = el.value; });
    state.personalRecords = SIC.recalcPRs(state.history);
    ui.overlay = null; toast('History updated. Records recalculated.'); markDirty(); render({ force: true });
  }
  function saveBuilder() {
    const name = ($('builder-name') && $('builder-name').value || '').trim();
    if (!name || !ui.builder) { toast('Name the routine first.'); return; }
    const days = {};
    ui.builder.days.forEach(function (d) {
      const label = d.name || 'Day';
      days[label] = d.exercises.filter(Boolean).map(function (exName) {
        const known = DATA.exerciseDatabase.find(function (e) { return e.name.toLowerCase() === exName.toLowerCase(); });
        return { id: ids('ex'), name: known ? known.name : exName, target: '4-6 Reps', muscle: known ? known.muscle : 'OTHER', sets: [{ id: ids('set'), type: 'Normal', weight: '', reps: '', p2Weight: '', p2Reps: '' }] };
      });
    });
    const id = ids('routine');
    state.routines[id] = { id: id, name: name, days: days };
    ui.overlay = null; toast('Routine saved.'); markDirty(); render({ force: true });
  }
  function clearData() {
    const dump = {};
    for (let i = 0; i < storage.length; i++) { const k = storage.key(i); if (SIC.isSicKey(k)) dump[k] = storage.getItem(k); }
    download('sic-backup-' + Date.now() + '.json', JSON.stringify(dump, null, 2), 'application/json');
    SIC.keysToClear(Object.keys(dump)).forEach(function (k) { storage.removeItem(k); });
    toast('SIC data cleared.');
    setTimeout(function () { location.reload(); }, 400);
  }
  function switchProfile(id) {
    if (!state.profiles.users[id] || id === state.profiles.activeId) return;
    state.profileVault[state.profiles.activeId] = SIC.snapshotWorkout(state);
    state.profiles.activeId = id;
    if (state.profileVault[id]) {
      const slice = state.profileVault[id];
      ['routines', 'history', 'currentSession', 'personalRecords', 'activeRoutineId', 'activeDay', 'duoMode', 'activePartner', 'partnerNames', 'rest'].forEach(function (k) { if (slice[k] !== undefined) state[k] = SIC.clone(slice[k]); });
    }
    toast('Profile switched.'); markDirty(); render({ force: true });
  }
  function runCommand(line) {
    const parsed = SIC.parseCommand(line);
    if (parsed.cmd === 'unknown' && line.trim()) { ui.console.push('Unknown command.'); return; }
    const res = SIC.applyCommand(state, parsed, { id: ids, now: Date.now(), confirmed: false });
    if (res.message) ui.console.push(res.message);
    if (parsed.cmd === 'deleteuser' && res.reason === 'confirm') {
      ui.dialog = { title: 'Delete profile?', message: res.message + ' A backup is kept in the result.', ok: 'Delete', resolve: function (yes) { if (!yes) return; const done = SIC.applyCommand(state, parsed, { confirmed: true }); ui.console.push(done.message || ''); if (done.backup) download('sic-profile-backup.json', JSON.stringify(done.backup), 'application/json'); markDirty(); } };
      return;
    }
    (res.actions || []).forEach(function (a) {
      if (a === 'save') persist('command');
      if (a === 'exit') { persist('exit'); ui.console.push(platformName() === 'android' && native() && native().exitApp ? 'Closing.' : 'saved, safe to close'); if (native() && native().exitApp && platformName() === 'android') native().exitApp(); }
      if (a === 'restart') { persist('restart'); location.reload(); }
      if (a === 'clear-console') ui.console = [];
      if (a === 'confirm-finish') ui.overlay = 'finish';
      if (a === 'open-bug') { ui.overlay = 'bug'; setTimeout(function () { const box = $('bug-text'); if (box) box.value = res.text || ''; }, 0); }
      if (a === 'render') render({ force: true });
    });
    markDirty();
  }
  async function openPip() {
    if (!window.documentPictureInPicture) { toast('Document Picture-in-Picture is not in this browser. The in-page mini still works.'); return; }
    ui.miniOpen = true; render({ force: true });
    const pip = await documentPictureInPicture.requestWindow({ width: 280, height: 420 });
    const link = pip.document.createElement('link');
    link.rel = 'stylesheet'; link.href = new URL('css/sic.css', location.href).href;
    pip.document.head.appendChild(link);
    pip.document.body.appendChild($('mini-root'));
    pip.addEventListener('pagehide', function () { document.body.appendChild($('mini-root')); });
  }

  function typingTarget(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable || el.dataset.console === '1';
  }
  function onKey(e) {
    if (e.key === '`' && (e.ctrlKey || e.metaKey)) { openOverlay('console'); e.preventDefault(); return; }
    if (e.target && e.target.id === 'console-input' && e.key === 'Enter') { runCommand(e.target.value); e.target.value = ''; render({ force: true }); e.preventDefault(); return; }
    const meta = { typing: typingTarget(e.target), consoleFocused: !!(e.target && e.target.dataset && e.target.dataset.console === '1') };
    if (!SIC.shortcutsAllowed(meta)) return;
    state.settings.lastInput = 'keyboard';
    const chord = (e.ctrlKey ? 'Ctrl+' : '') + (e.shiftKey ? 'Shift+' : '') + (e.metaKey ? 'Meta+' : '') + e.key;
    const codeChord = (e.ctrlKey ? 'Ctrl+' : '') + (e.shiftKey ? 'Shift+' : '') + e.code;
    if (codeChord === 'Ctrl+Shift+KeyF' || chord === 'Ctrl+Shift+F') { ui.overlay = 'finish'; render({ force: true }); e.preventDefault(); return; }
    const m = map();
    function hit(action, token) { return (m[action] || []).indexOf(token) >= 0; }
    if (hit('logSet', 'Space') && e.code === 'Space') { logSet(); e.preventDefault(); return; }
    if (hit('toggleMini', e.code) || e.key === 'm' && !e.ctrlKey && !e.metaKey && !e.altKey && hit('toggleMini', 'KeyM')) { ui.miniOpen = !ui.miniOpen; render({ force: true }); e.preventDefault(); return; }
    if (e.key === 'Escape' && hit('back', 'Escape')) { if (ui.overlay) { ui.overlay = null; render({ force: true }); } else if (ui.pop) { ui.pop = null; render({ force: true }); } e.preventDefault(); return; }
    if ((e.key === 's' || e.key === 'S') && hit('manageSets', 'KeyS')) { const cur = SIC.findCurrent(state); if (cur) { ui.pop = cur.exercise.id; render({ force: true }); } e.preventDefault(); return; }
    const cur = SIC.findCurrent(state);
    if (!cur) return;
    if (e.key === '[' || e.key === ']') { SIC.nudgeSet(state, cur.exercise.id, cur.set.id, 'weight', e.key === ']' ? 1 : -1, partner()); markDirty(); render({ force: true }); e.preventDefault(); }
    if (e.key === '-' || e.key === '=') { SIC.nudgeSet(state, cur.exercise.id, cur.set.id, 'reps', e.key === '=' ? 1 : -1, partner()); markDirty(); render({ force: true }); e.preventDefault(); }
    if (e.key === 'Enter') { const btn = document.querySelector('[data-focus="1"]:focus'); if (btn && btn.dataset.act) return; }
  }
  let padWas = [];
  let hold = null;
  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const pad = pads && pads[0];
    if (!pad) return;
    if (!document.hasFocus()) { requestAnimationFrame(pollPad); return; }
    const buttons = pad.buttons.map(function (b) { return b.pressed; });
    const name = /xbox|045e/i.test(pad.id) ? 'xbox' : /054c|wireless controller|dual/i.test(pad.id) ? 'playstation' : (state.settings.lastInput === 'playstation' || state.settings.lastInput === 'xbox' ? state.settings.lastInput : 'xbox');
    const labels = ['GamepadA', 'GamepadB', 'GamepadX', 'GamepadY', 'GamepadLB', 'GamepadRB', 'GamepadLT', 'GamepadRT', 'GamepadView', 'GamepadMenu', 'GamepadL3', 'GamepadR3', 'DpadUp', 'DpadDown', 'DpadLeft', 'DpadRight'];
    buttons.forEach(function (down, i) {
      const was = padWas[i];
      if (down && !was) {
        state.settings.lastInput = name;
        ui.testInput = (name === 'playstation' ? 'PS ' : 'Xbox ') + (labels[i] || i);
        const token = labels[i];
        if (i === 9) hold = { at: Date.now(), kind: 'menu' };
        handlePad(token);
      }
      if (!down && was && i === 9) hold = null;
    });
    if (hold && hold.kind === 'menu' && Date.now() - hold.at > 2000) { hold = null; ui.overlay = 'finish'; render({ force: true }); }
    const dirs = { weightDown: buttons[4], weightUp: buttons[5], repsDown: buttons[6], repsUp: buttons[7] };
    Object.keys(dirs).forEach(function (action) {
      if (!dirs[action] || !SIC.isHoldRepeatAction(action)) return;
      if (!hold || hold.kind !== action) hold = { kind: action, at: Date.now(), next: Date.now() + 400 };
      else if (Date.now() > hold.next) { hold.next = Date.now() + 80; nudgeAction(action); }
    });
    padWas = buttons;
    requestAnimationFrame(pollPad);
  }
  function handlePad(token) {
    if (!SIC.shortcutsAllowed({ typing: typingTarget(document.activeElement) })) return;
    const ps = nameIsPs();
    const select = ps && state.settings.psConfirmSwap ? 'GamepadCircle' : 'GamepadA';
    const back = ps && state.settings.psConfirmSwap ? 'GamepadA' : 'GamepadB';
    if (token === 'GamepadY') logSet();
    else if (token === select || token === 'GamepadA' && !ps) { const el = document.querySelector('[data-focus="1"]:focus'); if (el) el.click(); }
    else if (token === back || token === 'GamepadB') { if (ui.overlay) ui.overlay = null; else if (ui.pop) ui.pop = null; render({ force: true }); }
    else if (token === 'GamepadX') { const cur = SIC.findCurrent(state); if (cur) ui.pop = cur.exercise.id; render({ force: true }); }
    else if (token === 'GamepadLB' || token === 'DpadLeft') nudgeAction('weightDown');
    else if (token === 'GamepadRB' || token === 'DpadRight') nudgeAction('weightUp');
    else if (token === 'GamepadLT') nudgeAction('repsDown');
    else if (token === 'GamepadRT') nudgeAction('repsUp');
    else if (token === 'GamepadView') { ui.miniOpen = !ui.miniOpen; render({ force: true }); }
    if (ui.overlay === 'inputs') render({ force: true });
  }
  function nameIsPs() { return state.settings.lastInput === 'playstation'; }
  function nudgeAction(action) {
    const cur = SIC.findCurrent(state); if (!cur) return;
    const field = action.indexOf('weight') === 0 ? 'weight' : 'reps';
    const dir = /Up$/.test(action) ? 1 : -1;
    SIC.nudgeSet(state, cur.exercise.id, cur.set.id, field, dir, partner());
    markDirty(); render({ force: true });
  }

  let drag = null;
  function onPointerDown(e) {
    const dragHandle = e.target.closest && e.target.closest('[data-drag]');
    if (!dragHandle) return;
    const mini = $('mini-root');
    const rect = mini.getBoundingClientRect();
    drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    mini.setPointerCapture && mini.setPointerCapture(e.pointerId);
  }
  function onPointerMove(e) {
    if (!drag) return;
    const mini = $('mini-root');
    const x = Math.max(0, Math.min(window.innerWidth - 80, e.clientX - drag.dx));
    const y = Math.max(0, Math.min(window.innerHeight - 80, e.clientY - drag.dy));
    mini.style.left = x + 'px'; mini.style.top = y + 'px'; ui.miniPos = { x: x, y: y };
  }
  function onPointerUp() { drag = null; }

  window.SICApp = {
    onNativeResult: function (raw) {
      let msg = raw;
      try { msg = JSON.parse(raw); } catch (e) {}
      if (!msg || !msg.type) return;
      if (msg.type === 'folder') { ui.folderStatus[msg.kind] = msg.ok ? ('System folder granted for ' + msg.kind) : 'Folder permission was not granted. Local copy kept.'; render({ force: true }); }
      if (msg.type === 'import') previewXml(msg.text || '');
      if (msg.type === 'overlay') { ui.folderStatus.overlay = msg.ok ? 'Overlay permission granted. Hardware pass-through was not certified in this build.' : 'Overlay permission is off.'; }
    },
    state: function () { return state; }
  };

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('pointerdown', function (e) {
    userSound = true;
    const touch = e.pointerType === 'touch' || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    if (state.settings.lastInput !== 'keyboard' && state.settings.lastInput !== 'xbox' && state.settings.lastInput !== 'playstation') {
      state.settings.lastInput = touch ? 'touch' : 'mouse';
    }
  }, { capture: true });
  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  $('settings-anchor').addEventListener('click', function () { openOverlay('settings'); });
  window.addEventListener('beforeunload', function (e) { if (runtime.dirty && !state.settings.autosave) { e.preventDefault(); e.returnValue = ''; } });

  bootState();
  if (params.get('overlay') === '1') document.body.classList.add('overlay-only');
  if (window.SICFx) window.SICFx.init();
  applyChrome();
  render({ force: true });
  paintSave(demo ? 'saved' : 'saved');
  setInterval(tick, 250);
  window.addEventListener('gamepadconnected', function () {
    state.settings.lastInput = 'xbox';
    if (!runtime.padTimer) runtime.padTimer = setInterval(pollPad, 200);
  });
  if (params.get('pip') === '1') setTimeout(openPip, 300);
})();

</script>
</body>
</html>
